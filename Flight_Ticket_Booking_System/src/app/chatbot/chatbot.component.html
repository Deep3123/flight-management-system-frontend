<div class="chatbot-container">
  <!-- Chat Button -->
  <button class="chat-toggle-btn" (click)="toggleChat()" *ngIf="!isOpen">
    <mat-icon>chat</mat-icon>
  </button>

  <!-- Chat Window -->
  <div class="chat-window" *ngIf="isOpen">
    <div class="chat-header">
      <div class="chat-title-area">
        <mat-icon>support_agent</mat-icon>
        <span>JetWayz Assistant</span>
      </div>
      <div class="chat-actions">
        <button mat-icon-button (click)="clearChat()" title="Clear chat window to start a fresh conversation while keeping your profile details intact.">
          <mat-icon>autorenew</mat-icon>
        </button>
        <button mat-icon-button (click)="toggleChat()" title="Close Chatbot Window">
          <mat-icon>close</mat-icon>
        </button>
      </div>
    </div>

    <div class="chat-messages" #scrollMe>
      <div *ngFor="let msg of messages" 
           [ngClass]="{'bot-message': msg.isBot, 'user-message': !msg.isBot}">
        
        <div class="message-content" *ngIf="msg.text" [innerText]="msg.text"></div>
        
        <div class="message-content typing-dots" *ngIf="!msg.text && msg.isBot">
          <span></span><span></span><span></span>
        </div>
      </div>
    </div>

    <div class="chat-input-area">
      <input type="text" 
             [(ngModel)]="userInput" 
             (keyup.enter)="sendMessage()" 
             placeholder="Type your message..." />
      <button mat-icon-button (click)="sendMessage()" color="primary" [disabled]="!userInput.trim() || isLoading">
        <mat-icon>send</mat-icon>
      </button>
    </div>
  </div>
</div>
